name: Build Windows installer
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: .\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Prayer-Times-Windows
          path: |
            dist/*
            build/verification.txt
